# Builds and tests Daybook on every push to main, every pull request, and on demand.
# docs/release.md describes the pipeline, the runner image, and the caching.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      mac_configuration:
        description: Mac app configuration (Release builds the full unsigned archive, as a release does)
        type: choice
        options: [Debug, Release]
        default: Debug
      clean:
        description: Ignore the build caches
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  # github.workflow is "Release" when release.yml calls this workflow, so a push to main never queues
  # behind, or replaces, a release's validation of the same ref.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request pushes stop; main keeps every run so its caches are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The `xcode-27` image's Xcode 27.1 (27A9275): the iOS 27.1 SDK with the iPhone Duo hinge APIs.
  # Xcode.app on that image is 27.0. scripts/ci/select-xcode.sh checks the version.
  DAYBOOK_XCODE: /Applications/Xcode_27.1.app
  NSUnbufferedIO: "YES"

jobs:
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: actionlint
        # Also runs shellcheck (preinstalled) on every `run:` script.
        run: actionlint
      - name: shellcheck
        run: shellcheck scripts/build-ios.sh scripts/ci/*.sh scripts/ci/tests/*.sh
      - name: Release helper tests
        run: scripts/ci/tests/run-tests.sh

  package:
    name: Swift package tests
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Cache key
        id: key
        env:
          PACKAGE_HASH: ${{ hashFiles('Package.resolved', 'Package.swift') }}
        run: echo "build=swiftpm-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${PACKAGE_HASH}" >> "$GITHUB_OUTPUT"
      # MLX, WhisperKit, and FluidAudio dominate the build. The cache holds .build for the pinned
      # dependencies; only main saves it, so pull requests restore without filling the cache quota.
      - name: Restore the SwiftPM build
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.key.outputs.build }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-
      - name: Build the package and its tests
        id: build
        run: |
          # Swift Build's cached build plans hold the Metal compiler's absolute path, a cryptex mount
          # whose name differs on every runner. Plan again on this one; compiled objects stay cached
          # and only the Metal shader steps re-run.
          rm -rf .build/out/Intermediates.noindex/XCBuildData
          mkdir -p build/test-results
          swift build --build-tests 2>&1 | tee build/test-results/build.log
      - name: Save the SwiftPM build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.key.outputs.build }}
      # One step per test target group (each target is its own test bundle), so a failure names its
      # area and every group still runs. The two timing-budget tests run on their own afterwards.
      - name: Test DaybookCore
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          swift test --skip-build --filter '^DaybookCoreTests\.' \
            --skip 'AudioAlignerTests/testThirtyMinutePairAlignsWithinBudget$' 2>&1 | tee build/test-results/core.log
      - name: Test DaybookDevices, DaybookKit, and DaybookLink
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          swift test --skip-build --filter '^(DaybookDevicesTests|DaybookKitTests|DaybookLinkTests)\.' 2>&1 \
            | tee build/test-results/devices-kit-link.log
      - name: Test DaybookIntelligence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: swift test --skip-build --filter '^DaybookIntelligenceTests\.' 2>&1 | tee build/test-results/intelligence.log
      - name: Test DaybookCaptions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: swift test --skip-build --filter '^DaybookCaptionsTests\.' 2>&1 | tee build/test-results/captions.log
      - name: Test the Mac app target
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: swift test --skip-build --filter '^DaybookTests\.' 2>&1 | tee build/test-results/app.log
      # A 30-minute synthetic pair must align within 15 s. Hosted runners are small shared VMs, so the
      # test runs alone, after the build, with one retry; a pass on the retry leaves a warning.
      - name: Timing budget (alone, one retry)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scripts/ci/retry.sh 2 swift test --skip-build \
            --filter 'AudioAlignerTests/testThirtyMinutePairAlignsWithinBudget$' 2>&1 | tee build/test-results/timing-budget.log
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-logs
          path: build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  iphone:
    name: iPhone app
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --sdk iphoneos27.1 --sdk iphonesimulator27.1
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        env:
          PROJECT_HASH: ${{ hashFiles('Package.resolved', 'Package.swift', 'Apps/iOS/project.yml') }}
        run: echo "build=ios-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${PROJECT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: ios-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-
      - name: Pick a simulator
        id: simulator
        run: |
          udid="$(scripts/ci/pick-simulator.sh 2> "$RUNNER_TEMP/simulator.txt")"
          cat "$RUNNER_TEMP/simulator.txt"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          { echo "### iPhone simulator"; tail -1 "$RUNNER_TEMP/simulator.txt"; } >> "$GITHUB_STEP_SUMMARY"
          # Boot it now, so the test run doesn't spend its launch timeout on a cold boot.
          xcrun simctl bootstatus "$udid" -b
      - name: Build and test
        id: test
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/test-results
          scripts/build-ios.sh --test --simulator "$UDID" \
            --test-arg -parallel-testing-enabled --test-arg NO \
            --test-arg -skip-testing:DaybookPhoneTests/PhoneRecorderTests/testCrashRecoveryProducesAudioNotesAndBookmarks \
            --test-arg -resultBundlePath --test-arg build/test-results/DaybookPhoneTests.xcresult
      # Waits up to 30 s for the encoder's utility queue to reach the disk, which a starved VM can
      # miss. Alone, after the other tests, with one retry (xcodebuild reruns only a failed test).
      - name: Crash-recovery timing test (alone, one retry)
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          scripts/build-ios.sh --test --simulator "$UDID" \
            --test-arg -only-testing:DaybookPhoneTests/PhoneRecorderTests/testCrashRecoveryProducesAudioNotesAndBookmarks \
            --test-arg -retry-tests-on-failure --test-arg -test-iterations --test-arg 2 \
            --test-arg -resultBundlePath --test-arg build/test-results/CrashRecovery.xcresult
      - name: Save derived data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.test.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Archive for a device (unsigned, Release)
        id: archive
        if: ${{ !cancelled() }}
        run: scripts/build-ios.sh --archive --no-sign --marketing-version 0.0.0 --build-number "${GITHUB_RUN_NUMBER}"
      # What release.yml enforces before uploading. Reported, not blocking, until the app has an icon.
      - name: Check the archive as a release would
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        run: scripts/ci/check-ios-archive.sh Apps/iOS/build/DaybookPhone.xcarchive --version 0.0.0 --build "${GITHUB_RUN_NUMBER}"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-test-results
          path: |
            build/test-results/
            Apps/iOS/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  mac:
    name: Mac app (Xcode, ad hoc)
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CONFIGURATION: ${{ inputs.mac_configuration || 'Debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        env:
          PROJECT_HASH: ${{ hashFiles('Package.resolved', 'Package.swift', 'Apps/macOS/project.yml') }}
        run: echo "build=mac-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${CONFIGURATION}-${PROJECT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: mac-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-${{ env.CONFIGURATION }}-
      - name: Build (no team, signed to run locally)
        id: build
        run: |
          args=(--ad-hoc)
          if [[ "$CONFIGURATION" == Debug ]]; then args+=(--debug); fi
          scripts/build-app.sh "${args[@]}"
      - name: Check the app bundle
        run: |
          app=dist/Daybook.app
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Daybook.icns"
          metallib="$(find "$app" -name default.metallib -print -quit)"
          test -n "$metallib" || { echo "::error::No MLX default.metallib in the app: the Metal shaders weren't compiled"; exit 1; }
          echo "Metal library: $metallib"
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist"
      - name: Save derived data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-build-logs
          path: build/macOS/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore
