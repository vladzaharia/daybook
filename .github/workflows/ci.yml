# Builds and tests Daybook on every push to main, every pull request, and on demand.
# docs/release.md describes the pipeline, the runner image, and the caching.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml validates the release commit with this workflow, building the Mac app in Release, as
  # the release does.
  workflow_call:
    inputs:
      mac_configuration:
        description: Mac app configuration (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      mac_configuration:
        description: Mac app configuration (Release builds the full unsigned archive, as a release does)
        type: choice
        options: [Debug, Release]
        default: Debug
      clean:
        description: Ignore the build caches
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  # github.workflow is "Release" when release.yml calls this workflow, so a push to main never queues
  # behind, or replaces, a release's validation of the same ref.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request pushes stop; main keeps every run so its caches are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The `xcode-27` image's Xcode 27.1 (27A9275): the iOS 27.1 SDK with the iPhone Duo hinge APIs.
  # Xcode.app on that image is 27.0. scripts/ci/select-xcode.sh checks the version.
  DAYBOOK_XCODE: /Applications/Xcode_27.1.app
  NSUnbufferedIO: "YES"

jobs:
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: actionlint
        # Also runs shellcheck (preinstalled) on every `run:` script.
        run: actionlint
      - name: shellcheck
        # The shared libraries too: shellcheck reports only on the files it's given (scripts/.shellcheckrc follows them).
        run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/ci/*.sh scripts/ci/lib/*.sh scripts/ci/tests/*.sh
      - name: Release helper tests
        run: scripts/ci/tests/run-tests.sh

  # A pull request runs only the jobs its files need (scripts/ci/changes.sh): one app's own files skip the other's
  # jobs, documentation skips them all. Every push to main runs them all.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.diff.outputs.package }}
      iphone: ${{ steps.diff.outputs.iphone }}
      mac: ${{ steps.diff.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Code or documentation
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: scripts/ci/changes.sh --event "$EVENT" | tee -a "$GITHUB_OUTPUT"

  package:
    name: Swift package tests
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A checkout dates every file now, and SwiftPM and Xcode rebuild what's newer than their records: dated by
      # their content instead, unchanged files match the restored build's and aren't compiled again.
      - name: Date the files by their content
        run: scripts/ci/stable-mtimes.sh
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Cache key
        id: key
        run: echo "build=swiftpm-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # The newest build main saved: every push to main saves its own (the caches job then deletes the older),
      # and pull requests only restore, so they don't fill the cache quota.
      - name: Restore the SwiftPM build
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.key.outputs.build }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-
      - name: Build the package and its tests
        id: build
        run: |
          # Swift Build's cached build plans (the *.xcbuilddata) hold the Metal compiler's absolute path, a
          # cryptex mount whose name differs on every runner. Plan again on this one, but keep build.db beside
          # them, llbuild's record of every task's last run: without it every task counts as never run and the
          # whole package compiles again. Compiled objects stay cached; the Metal shader steps and links re-run.
          rm -rf .build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata
          mkdir -p build/test-results
          # Only the versions Package.resolved pins; fail if resolution would change the file.
          swift build --build-tests --force-resolved-versions 2>&1 | tee build/test-results/build.log
          git diff --exit-code -- Package.resolved
      - name: Save the SwiftPM build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.key.outputs.build }}
      # Daybook's own code builds without a warning. The dependencies print dozens, so this reads the log by path
      # rather than passing -warnings-as-errors; after the cache is saved, and the tests still run when it fails.
      - name: No warnings in Daybook's own code
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci/own-warnings.sh build/test-results/build.log
      # Every test bundle, in two lanes side by side (scripts/ci/test-lanes.sh): the runner has three cores, and the
      # tests mostly keep one busy. Every bundle runs whatever the others did, a failure names its bundle and tests,
      # and a test bundle that's in no lane fails the step. Bundles run straight from xctest, sparing SwiftPM's start;
      # DaybookCoreTests through `swift test`, to skip the timing-budget test, which runs on its own afterwards.
      # DAYBOOK_TEST_TIMEOUT_SCALE doubles every test wait (Tests/DaybookTestSupport): hosted runners are small
      # shared VMs. The timing-budget step keeps its own budget.
      - name: Test, in two lanes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DAYBOOK_TEST_TIMEOUT_SCALE: "2"
        run: |
          scripts/ci/test-lanes.sh --products "$(swift build --show-bin-path)" --logs build/test-results \
            --skip DaybookCoreTests 'AudioAlignerTests/testThirtyMinutePairAlignsWithinBudget$' \
            'DaybookTests DaybookIntelligenceTests DaybookLinkTests DaybookUITests DaybookDesignTests DaybookCaptionsTests' \
            'DaybookCoreTests DaybookKitTests DaybookDevicesTests DaybookLiveTests'
      # A 30-minute synthetic pair must align within 15 s. Hosted runners are small shared VMs, so the
      # test runs alone, after the others, with one retry; a pass on the retry leaves a warning.
      - name: Timing budget (alone, one retry)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scripts/ci/retry.sh 2 xcrun xctest -XCTest 'DaybookCoreTests.AudioAlignerTests/testThirtyMinutePairAlignsWithinBudget' \
            "$(swift build --show-bin-path)/DaybookCoreTests.xctest" 2>&1 | tee build/test-results/timing-budget.log
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-logs
          path: build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  iphone:
    name: iPhone app
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    runs-on: xcode-27
    # A few minutes when the restored cache is current; a cold one compiles MLX and the rest, about 20 minutes.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date the files by their content
        run: scripts/ci/stable-mtimes.sh
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --sdk iphoneos27.1 --sdk iphonesimulator27.1
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        run: echo "build=ios-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: ios-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-
      - name: Pick a simulator
        id: simulator
        run: |
          udid="$(scripts/ci/pick-simulator.sh 2> "$RUNNER_TEMP/simulator.txt")"
          cat "$RUNNER_TEMP/simulator.txt"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          { echo "### iPhone simulator"; tail -1 "$RUNNER_TEMP/simulator.txt"; } >> "$GITHUB_STEP_SUMMARY"
      # Once, for the runner's architecture; both test steps run on what it made.
      - name: Build for testing
        id: build
        run: scripts/build-ios.sh --build-for-testing
      # After the build, not beside it: a first boot starts all of iOS (wallpapers, system widgets, Apple
      # Intelligence, Siri, Maps…), which held the load average in the hundreds for minutes on this three-core
      # runner and made every xcodebuild beside it start minutes late (docs/release.md, "The simulator").
      - name: Boot the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > "$RUNNER_TEMP/bootstatus.txt" 2>&1 || { cat "$RUNNER_TEMP/bootstatus.txt"; exit 1; }
          tail -1 "$RUNNER_TEMP/bootstatus.txt"
      # xcodebuild hands TEST_RUNNER_-prefixed variables to the test runner without the prefix: every
      # test wait doubles (DaybookPhoneTests/TestSupport.swift). The encoder timing step keeps its own.
      - name: Test
        id: test
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_DAYBOOK_TEST_TIMEOUT_SCALE: "2"
        run: |
          mkdir -p build/test-results
          scripts/build-ios.sh --test --skip-build --simulator "$UDID" \
            --test-arg -parallel-testing-enabled --test-arg NO \
            --test-arg -skip-testing:DaybookPhoneTests/PhoneRecorderTests/testCrashRecoveryProducesAudioNotesAndBookmarks \
            --test-arg -skip-testing:DaybookPhoneTests/PhoneRecorderTests/testRealTimeSegmentsReachTheDiskAtEachFragmentInterval \
            --test-arg -resultBundlePath --test-arg build/test-results/DaybookPhoneTests.xcresult
      # Both wait for the encoder's utility queue to reach the disk (crash recovery up to 30 s, the
      # fragment test at each fragment interval), which a starved VM can miss. Alone, after the other
      # tests, with one retry (xcodebuild reruns only a failed test). xcodebuild calls a pass on the
      # retry a pass, so xcresult-retries.sh reads the result bundle and leaves a warning for it.
      - name: Encoder timing tests (alone, one retry)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          status=0
          scripts/build-ios.sh --test --skip-build --simulator "$UDID" \
            --test-arg -only-testing:DaybookPhoneTests/PhoneRecorderTests/testCrashRecoveryProducesAudioNotesAndBookmarks \
            --test-arg -only-testing:DaybookPhoneTests/PhoneRecorderTests/testRealTimeSegmentsReachTheDiskAtEachFragmentInterval \
            --test-arg -retry-tests-on-failure --test-arg -test-iterations --test-arg 2 \
            --test-arg -resultBundlePath --test-arg build/test-results/EncoderTiming.xcresult || status=$?
          scripts/ci/xcresult-retries.sh build/test-results/EncoderTiming.xcresult || true
          exit "$status"
      - name: Save derived data
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-test-results
          path: |
            build/test-results/
            Apps/iOS/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  # The Release archive a release builds, unsigned, beside the tests rather than after them. Its cache is
  # the one release.yml's iphone job restores for the signed archive.
  iphone-archive:
    name: iPhone archive (Release)
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date the files by their content
        run: scripts/ci/stable-mtimes.sh
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --sdk iphoneos27.1
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        run: echo "build=ios-release-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: ios-release-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-
      - name: Archive for a device (unsigned, Release)
        id: archive
        run: scripts/build-ios.sh --archive --no-sign --marketing-version 0.0.0 --build-number "${GITHUB_RUN_NUMBER}"
      # What release.yml enforces before uploading. Reported, not blocking, until the app has an icon.
      - name: Check the archive as a release would
        continue-on-error: true
        run: scripts/ci/check-ios-archive.sh Apps/iOS/build/DaybookPhone.xcarchive --version 0.0.0 --build "${GITHUB_RUN_NUMBER}"
      # The next archive deletes ArchiveIntermediates before it starts, so they aren't worth saving: what it reuses
      # is the compilation cache beside them (scripts/build-ios.sh). The paths below stay as they are, since a
      # cache restores only under the same path list (release.yml's iphone job restores this one).
      - name: Drop the intermediates the next archive deletes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.archive.outcome == 'success'
        run: rm -rf Apps/iOS/build/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates
      - name: Save derived data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.archive.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Apps/iOS/build/DerivedData
            !Apps/iOS/build/DerivedData/Logs
            !Apps/iOS/build/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-archive-logs
          path: Apps/iOS/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  mac:
    name: Mac app (Xcode, ad hoc)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.build }}
    env:
      CONFIGURATION: ${{ inputs.mac_configuration || 'Debug' }}
    steps:
      - name: Check the configuration
        run: |
          case "$CONFIGURATION" in
            Debug|Release) ;;
            *) echo "::error::mac_configuration is Debug or Release, not $CONFIGURATION"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date the files by their content
        run: scripts/ci/stable-mtimes.sh
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      # The release helpers' tests again, on macOS, where every group runs: CryptoKit's JWT check, the
      # archive checks, the upload retry, the build scripts, and the keychain (the lint job is Linux).
      - name: Release helper tests (macOS, every group)
        run: scripts/ci/tests/run-tests.sh --require-all
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        run: echo "build=mac-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-${CONFIGURATION}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: mac-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-${{ env.CONFIGURATION }}-
      - name: Build (no team, signed to run locally)
        id: build
        run: |
          args=(--ad-hoc)
          if [[ "$CONFIGURATION" == Debug ]]; then args+=(--debug); fi
          scripts/build-app.sh "${args[@]}"
      - name: Check the app bundle
        run: |
          app=dist/Daybook.app
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Daybook.icns"
          metallib="$(find "$app" -name default.metallib -print -quit)"
          test -n "$metallib" || { echo "::error::No MLX default.metallib in the app: the Metal shaders weren't compiled"; exit 1; }
          echo "Metal library: $metallib"
          # Sandboxed, as local.daybook.adhoc, with no migration manifest: an ad hoc build can never create the
          # app's container or move a library into it (docs/sandbox.md).
          scripts/ci/check-mac-app.sh --app "$app" --kind adhoc
      - name: Save derived data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-build-logs
          path: build/macOS/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  # Pushes to main only: the Mac app's Release archive as a release builds it (ad hoc here: signing changes no
  # compile), so main keeps building in Release, and the release's two Mac archives restore its cache.
  mac-archive:
    name: Mac archive (Release, ad hoc)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date the files by their content
        run: scripts/ci/stable-mtimes.sh
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Cache key
        id: key
        run: echo "build=mac-dd-${RUNNER_OS}-${DAYBOOK_XCODE_BUILD}-Release-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
          restore-keys: mac-dd-${{ runner.os }}-${{ env.DAYBOOK_XCODE_BUILD }}-Release-
      - name: Archive (no team, signed to run locally)
        id: archive
        run: scripts/build-app.sh --ad-hoc --archive-only
      # As in iphone-archive: the next archive deletes ArchiveIntermediates and reuses the compilation cache
      # (scripts/build-app.sh). Same paths as before, so release.yml's mac and mac-testflight jobs still restore it.
      - name: Drop the intermediates the next archive deletes
        if: steps.restore.outputs.cache-hit != 'true' && steps.archive.outcome == 'success'
        run: rm -rf build/macOS/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates
      - name: Save derived data
        if: steps.restore.outputs.cache-hit != 'true' && steps.archive.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/macOS/DerivedData
            build/macOS/SourcePackages
            !build/macOS/DerivedData/Logs
            !build/macOS/DerivedData/Index.noindex
          key: ${{ steps.key.outputs.build }}
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-archive-logs
          path: build/macOS/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  # After a push to main has saved its caches (each job's key ends in the commit), the older caches of the
  # same families go, so they don't crowd the 10 GB quota. A family whose new cache wasn't saved is left alone. The only job that can write to Actions; it
  # builds nothing and runs only scripts/ci/prune-caches.sh.
  caches:
    name: Prune superseded caches
    needs: [package, iphone, iphone-archive, mac, mac-archive]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete older caches of this run's families
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEYS: >-
            ${{ needs.package.outputs.cache_key }} ${{ needs.iphone.outputs.cache_key }}
            ${{ needs.iphone-archive.outputs.cache_key }} ${{ needs.mac.outputs.cache_key }} ${{ needs.mac-archive.outputs.cache_key }}
        run: |
          read -r -a keys <<< "$KEYS"
          scripts/ci/prune-caches.sh --repo "$REPO" --ref refs/heads/main ${keys[@]+"${keys[@]}"}
