# Releases Daybook: the iPhone app to TestFlight, and the Mac app as a Developer ID signed, notarized
# download on a GitHub Release. Runs for a pushed v* tag, or by hand from main or a v* tag.
# Signing jobs wait for approval in the `release` environment, which holds every secret.
# docs/release.md covers the setup, the secrets, and how to cut a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to release
        type: choice
        options: [both, iphone, mac]
        default: both
      version:
        description: Marketing version X.Y.Z (needed when running from main; a tag sets it)
        type: string
        required: false
      testflight_group:
        description: TestFlight beta group (blank uses the DAYBOOK_TESTFLIGHT_GROUP variable; "none" skips)
        type: string
        required: false
      testflight_notes:
        description: What to Test (blank uses the tag message and commits since the previous tag)
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The `xcode-27` image's Xcode 27.1 (27A9275), with the iOS 27.1 SDK (docs/release.md, Runner).
  DAYBOOK_XCODE: /Applications/Xcode_27.1.app
  NSUnbufferedIO: "YES"

jobs:
  validate:
    name: Validate the release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the run's creation time, below
    # No build number here: "Re-run failed jobs" doesn't re-run this job, so the iphone and mac jobs
    # work theirs out from their own github.run_attempt.
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      run_created_at: ${{ steps.created.outputs.created_at }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      iphone: ${{ steps.apps.outputs.iphone }}
      mac: ${{ steps.apps.outputs.mac }}
      testflight_group: ${{ steps.apps.outputs.testflight_group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A v* tag must point at a commit on main (pushed or picked in a manual run); a manual run from a
      # branch must be from main. Nothing else releases.
      - name: Check the ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! scripts/ci/check-ref.sh --event "$EVENT" --ref "$REF" --sha "$GITHUB_SHA" --default-branch "$DEFAULT_BRANCH" 2> "$RUNNER_TEMP/ref.txt"; then
            echo "::error::$(cat "$RUNNER_TEMP/ref.txt")"
            exit 1
          fi
      - name: Version and build number
        id: version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFSET: ${{ vars.DAYBOOK_BUILD_NUMBER_OFFSET || '1000' }}
        run: |
          args=(--ref "$REF" --run-number "$RUN_NUMBER" --run-attempt "$RUN_ATTEMPT" --offset "$OFFSET")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          scripts/ci/version.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      # The same for every attempt of the run: an App Store Connect build uploaded before it can't be
      # this run's (asc-testflight.sh --find-build --uploaded-after).
      - name: When the run was created
        id: created
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          created="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at)"
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || { echo "::error::Unexpected creation time '$created'"; exit 1; }
          echo "created_at=$created" | tee -a "$GITHUB_OUTPUT"
      - name: Apps and TestFlight group
        id: apps
        env:
          APPS: ${{ inputs.apps || 'both' }}
          GROUP_INPUT: ${{ inputs.testflight_group }}
          GROUP_DEFAULT: ${{ vars.DAYBOOK_TESTFLIGHT_GROUP }}
        run: |
          case "$APPS" in
            both) iphone=true; mac=true ;;
            iphone) iphone=true; mac=false ;;
            mac) iphone=false; mac=true ;;
            *) echo "::error::Unknown apps choice $APPS"; exit 1 ;;
          esac
          group="${GROUP_INPUT:-$GROUP_DEFAULT}"
          if [[ "$group" == none ]]; then group=""; fi
          {
            echo "iphone=$iphone"
            echo "mac=$mac"
            echo "testflight_group=$group"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_INPUT: ${{ inputs.testflight_notes }}
        run: |
          mkdir -p notes
          ref="$GITHUB_SHA"
          if [[ -n "$TAG" ]]; then
            # Make sure the annotated tag (and its message) is present, not a lightweight copy.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
            ref="refs/tags/$TAG"
          fi
          scripts/ci/release-notes.sh --ref "$ref" > notes/release.md
          if [[ -n "$NOTES_INPUT" ]]; then
            printf '%s\n' "$NOTES_INPUT" > notes/testflight.txt
          else
            scripts/ci/release-notes.sh --ref "$ref" --format text > notes/testflight.txt
          fi
          cat notes/release.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          retention-days: 30
          if-no-files-found: error

  iphone:
    name: iPhone to TestFlight
    needs: [prepare, validate]
    if: needs.prepare.outputs.iphone == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    env:
      DAYBOOK_TEAM_ID: ${{ vars.DAYBOOK_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.marketing_version }}
      RUN_CREATED_AT: ${{ needs.prepare.outputs.run_created_at }}
    steps:
      - name: Check the configuration
        run: |
          if [[ ! "$DAYBOOK_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Set the DAYBOOK_TEAM_ID repository variable (scripts/ci/setup-github.sh)."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build number for this attempt
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFSET: ${{ vars.DAYBOOK_BUILD_NUMBER_OFFSET || '1000' }}
        run: |
          numbers="$(scripts/ci/version.sh --ref "$REF" --version "$VERSION" --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" --offset "$OFFSET" | grep '^build_')"
          printf '%s\n' "$numbers"
          {
            echo "BUILD=$(printf '%s\n' "$numbers" | sed -n 's/^build_number=//p')"
            echo "BUILD_CANDIDATES=$(printf '%s\n' "$numbers" | sed -n 's/^build_candidates=//p')"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --sdk iphoneos27.1
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      # Secrets: each step that needs the API key gets it from the environment and runs inside
      # `scripts/ci/secrets.sh run`, which writes the key for that command only and deletes it after.
      # A re-run after an upload that went through (the job then failed waiting for processing, say)
      # finds that build and goes straight to TestFlight instead of uploading a duplicate.
      - name: Look for this run's build in App Store Connect
        id: earlier
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          found="$(scripts/ci/secrets.sh run -- scripts/ci/asc-testflight.sh --bundle-id local.daybook.phone \
            --version "$VERSION" --find-build "$BUILD_CANDIDATES" --uploaded-after "$RUN_CREATED_AT" | sed -n 's/^found=//p')"
          echo "build=$found" >> "$GITHUB_OUTPUT"
          if [[ -n "$found" ]]; then
            echo "BUILD=$found" >> "$GITHUB_ENV"
            echo "::notice title=Already uploaded::Daybook $VERSION ($found) is in App Store Connect from an earlier attempt; skipping the archive and upload"
          fi
      # Package checkouts and manifests run before any secret exists.
      - name: Fetch the packages at their pinned versions
        if: steps.earlier.outputs.build == ''
        run: scripts/build-ios.sh --resolve
      # Automatic signing creates the runner's development certificate and profiles through the API
      # key while the archive builds, so the key has to exist while third-party package code compiles
      # (docs/release.md, "Secrets on the runner"). It exists for this step only.
      - name: Archive DaybookPhone with its widget extension
        if: steps.earlier.outputs.build == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/ci/secrets.sh run -- scripts/build-ios.sh --archive --marketing-version "$VERSION" --build-number "$BUILD"
      - name: Check the archive (export compliance, icon, versions, entitlements)
        if: steps.earlier.outputs.build == ''
        run: scripts/ci/check-ios-archive.sh Apps/iOS/build/DaybookPhone.xcarchive --version "$VERSION" --build "$BUILD"
      - name: Export and upload to App Store Connect (unless the build is there already)
        if: steps.earlier.outputs.build == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          found="$(scripts/ci/secrets.sh run -- scripts/ci/asc-testflight.sh --bundle-id local.daybook.phone \
            --version "$VERSION" --find-build "$BUILD_CANDIDATES" --uploaded-after "$RUN_CREATED_AT" | sed -n 's/^found=//p')"
          if [[ -n "$found" ]]; then
            echo "BUILD=$found" >> "$GITHUB_ENV"
            echo "::warning title=Upload skipped::Daybook $VERSION ($found) is already in App Store Connect; not uploading it again"
          else
            scripts/ci/secrets.sh run -- scripts/build-ios.sh --export upload
          fi
      - name: Wait for processing, set What to Test, add to the beta group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          GROUP: ${{ needs.prepare.outputs.testflight_group }}
        run: |
          args=(--bundle-id local.daybook.phone --version "$VERSION" --build "$BUILD"
                --notes-file notes/testflight.txt --timeout 3600)
          if [[ -n "$GROUP" ]]; then args+=(--group "$GROUP"); fi
          scripts/ci/secrets.sh run -- scripts/ci/asc-testflight.sh "${args[@]}"
          where=""
          if [[ -n "$GROUP" ]]; then where=" in the beta group \"$GROUP\""; fi
          {
            echo "### TestFlight"
            echo "Daybook $VERSION ($BUILD) is on TestFlight${where}."
          } >> "$GITHUB_STEP_SUMMARY"
      # A backstop: every secret is already gone unless a step was killed.
      - name: Remove secrets
        if: always()
        run: scripts/ci/secrets.sh cleanup
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-release-logs
          path: |
            Apps/iOS/build/ExportOptions.plist
            Apps/iOS/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  mac:
    name: Mac, Developer ID and notarized
    needs: [prepare, validate]
    if: needs.prepare.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 150
    environment: release
    permissions:
      contents: read
    env:
      DAYBOOK_TEAM_ID: ${{ vars.DAYBOOK_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.marketing_version }}
    steps:
      - name: Check the configuration
        run: |
          if [[ ! "$DAYBOOK_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Set the DAYBOOK_TEAM_ID repository variable (scripts/ci/setup-github.sh)."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build number for this attempt
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFSET: ${{ vars.DAYBOOK_BUILD_NUMBER_OFFSET || '1000' }}
        run: |
          numbers="$(scripts/ci/version.sh --ref "$REF" --version "$VERSION" --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" --offset "$OFFSET" | grep '^build_')"
          printf '%s\n' "$numbers"
          echo "BUILD=$(printf '%s\n' "$numbers" | sed -n 's/^build_number=//p')" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      # Package checkouts and manifests run before any secret exists.
      - name: Fetch the packages at their pinned versions
        run: scripts/build-app.sh --resolve-only
      # The archive signs for development through the API key (automatic signing), so the key has to
      # exist while third-party package code compiles (docs/release.md, "Secrets on the runner"). It
      # exists for this step only; the Developer ID identity isn't on the runner yet.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/ci/secrets.sh run -- scripts/build-app.sh --archive-only --marketing-version "$VERSION" --build-number "$BUILD"
      # The .p12 is optional: without it, -exportArchive signs with Xcode's cloud-managed Developer ID
      # certificate, which the API key's role may not allow (docs/release.md, Signing). With it, the
      # export signs manually with its identity and the Developer ID profile (scripts/ci/mac-export.sh).
      # The keychain exists only during this step and the next, when nothing compiles.
      - name: Export with Developer ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci/secrets.sh run -- scripts/ci/mac-export.sh
      - name: Notarize, staple, and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci/secrets.sh run -- scripts/ci/package-mac.sh --app dist/Daybook.app --version "$VERSION" --output dist/release --notarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release
          path: dist/release/
          retention-days: 30
          if-no-files-found: error
      # A backstop: every secret is already gone unless a step was killed.
      - name: Remove secrets
        if: always()
        run: scripts/ci/secrets.sh cleanup
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release-logs
          path: |
            build/macOS/ExportOptions.plist
            build/macOS/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  # The GitHub Release starts as a draft as soon as the Mac app is packaged, and becomes public only
  # once every app the run releases is out (`publish`). Neither job holds Apple secrets.
  draft:
    name: GitHub Release (draft)
    needs: [prepare, mac]
    if: needs.prepare.outputs.is_tag == 'true' && needs.mac.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      # A re-run updates its own draft (stale files go), but never a published release.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.marketing_version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          url="$(scripts/ci/github-release.sh draft --repo "$REPO" --tag "$TAG" --title "Daybook $VERSION" \
            --notes-file notes/release.md --prerelease "$PRERELEASE" dist/*)"
          { echo "### GitHub Release (draft)"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the GitHub Release
    needs: [prepare, draft, iphone]
    # After the draft, and after the iPhone build is on TestFlight when this run releases the iPhone
    # app (`apps: mac` skips the iphone job, and publishing doesn't wait for it then).
    if: >-
      !cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.draft.result == 'success' &&
      (needs.iphone.result == 'success' || (needs.iphone.result == 'skipped' && needs.prepare.outputs.iphone != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          url="$(scripts/ci/github-release.sh publish --repo "$REPO" --tag "$TAG")"
          { echo "### GitHub Release"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
