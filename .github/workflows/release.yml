# Releases Daybook: the iPhone app to TestFlight, and the Mac app as a Developer ID signed, notarized
# download on a GitHub Release. Runs for a pushed v* tag, or by hand from main or a v* tag.
# Signing jobs wait for approval in the `release` environment, which holds every secret.
# docs/release.md covers the setup, the secrets, and how to cut a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to release
        type: choice
        options: [both, iphone, mac]
        default: both
      version:
        description: Marketing version X.Y.Z (needed when running from main; a tag sets it)
        type: string
        required: false
      testflight_group:
        description: TestFlight beta group (blank uses the DAYBOOK_TESTFLIGHT_GROUP variable; "none" skips)
        type: string
        required: false
      testflight_notes:
        description: What to Test (blank uses the tag message and commits since the previous tag)
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The `xcode-27` image's Xcode 27.1 (27A9275), with the iOS 27.1 SDK (docs/release.md, Runner).
  DAYBOOK_XCODE: /Applications/Xcode_27.1.app
  NSUnbufferedIO: "YES"

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      iphone: ${{ steps.apps.outputs.iphone }}
      mac: ${{ steps.apps.outputs.mac }}
      testflight_group: ${{ steps.apps.outputs.testflight_group }}
    steps:
      - name: Check the ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            "refs/heads/$DEFAULT_BRANCH")
              if [[ "$EVENT" != workflow_dispatch ]]; then
                echo "::error::Only a v* tag push or a manual run starts a release."; exit 1
              fi ;;
            *) echo "::error::Releases run from a v* tag or from $DEFAULT_BRANCH, not $REF."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version and build number
        id: version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFSET: ${{ vars.DAYBOOK_BUILD_NUMBER_OFFSET || '1000' }}
        run: |
          args=(--ref "$REF" --run-number "$RUN_NUMBER" --run-attempt "$RUN_ATTEMPT" --offset "$OFFSET")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          scripts/ci/version.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: Apps and TestFlight group
        id: apps
        env:
          APPS: ${{ inputs.apps || 'both' }}
          GROUP_INPUT: ${{ inputs.testflight_group }}
          GROUP_DEFAULT: ${{ vars.DAYBOOK_TESTFLIGHT_GROUP }}
        run: |
          case "$APPS" in
            both) iphone=true; mac=true ;;
            iphone) iphone=true; mac=false ;;
            mac) iphone=false; mac=true ;;
            *) echo "::error::Unknown apps choice $APPS"; exit 1 ;;
          esac
          group="${GROUP_INPUT:-$GROUP_DEFAULT}"
          if [[ "$group" == none ]]; then group=""; fi
          {
            echo "iphone=$iphone"
            echo "mac=$mac"
            echo "testflight_group=$group"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_INPUT: ${{ inputs.testflight_notes }}
        run: |
          mkdir -p notes
          ref="$GITHUB_SHA"
          if [[ -n "$TAG" ]]; then
            # Make sure the annotated tag (and its message) is present, not a lightweight copy.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
            ref="refs/tags/$TAG"
          fi
          scripts/ci/release-notes.sh --ref "$ref" > notes/release.md
          if [[ -n "$NOTES_INPUT" ]]; then
            printf '%s\n' "$NOTES_INPUT" > notes/testflight.txt
          else
            scripts/ci/release-notes.sh --ref "$ref" --format text > notes/testflight.txt
          fi
          cat notes/release.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          retention-days: 30
          if-no-files-found: error

  iphone:
    name: iPhone to TestFlight
    needs: prepare
    if: needs.prepare.outputs.iphone == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    env:
      DAYBOOK_TEAM_ID: ${{ vars.DAYBOOK_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.marketing_version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Check the configuration
        run: |
          if [[ ! "$DAYBOOK_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Set the DAYBOOK_TEAM_ID repository variable (scripts/ci/setup-github.sh)."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --sdk iphoneos27.1
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/ci/secrets.sh setup
      # Automatic signing with the API key: Xcode's cloud-managed signing supplies the certificates
      # and profiles (no exported .p12 for the iPhone app).
      - name: Archive DaybookPhone with its widget extension
        run: scripts/build-ios.sh --archive --marketing-version "$VERSION" --build-number "$BUILD"
      - name: Check the archive (export compliance, icon, versions, entitlements)
        run: scripts/ci/check-ios-archive.sh Apps/iOS/build/DaybookPhone.xcarchive --version "$VERSION" --build "$BUILD"
      - name: Export and upload to App Store Connect
        run: scripts/build-ios.sh --export upload
      - name: Wait for processing, set What to Test, add to the beta group
        env:
          GROUP: ${{ needs.prepare.outputs.testflight_group }}
        run: |
          args=(--bundle-id local.daybook.phone --version "$VERSION" --build "$BUILD"
                --notes-file notes/testflight.txt --timeout 3600)
          if [[ -n "$GROUP" ]]; then args+=(--group "$GROUP"); fi
          scripts/ci/asc-testflight.sh "${args[@]}"
          where=""
          if [[ -n "$GROUP" ]]; then where=" in the beta group \"$GROUP\""; fi
          {
            echo "### TestFlight"
            echo "Daybook $VERSION ($BUILD) is on TestFlight${where}."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove secrets
        if: always()
        run: scripts/ci/secrets.sh cleanup
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-release-logs
          path: |
            Apps/iOS/build/ExportOptions.plist
            Apps/iOS/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  mac:
    name: Mac, Developer ID and notarized
    needs: prepare
    if: needs.prepare.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 150
    environment: release
    permissions:
      contents: read
    env:
      DAYBOOK_TEAM_ID: ${{ vars.DAYBOOK_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.marketing_version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Check the configuration
        run: |
          if [[ ! "$DAYBOOK_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Set the DAYBOOK_TEAM_ID repository variable (scripts/ci/setup-github.sh)."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh --metal
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh
      # The .p12 is optional: without it, -exportArchive signs with Xcode's cloud-managed Developer ID
      # certificate, which the API key's role may not allow (docs/release.md, Signing).
      - name: Write the API key (and the Developer ID keychain, if configured)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci/secrets.sh setup
      - name: Archive and export with Developer ID
        run: scripts/build-app.sh --marketing-version "$VERSION" --build-number "$BUILD"
      - name: Notarize, staple, and package
        run: scripts/ci/package-mac.sh --app dist/Daybook.app --version "$VERSION" --output dist/release --notarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release
          path: dist/release/
          retention-days: 30
          if-no-files-found: error
      - name: Remove secrets
        if: always()
        run: scripts/ci/secrets.sh cleanup
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release-logs
          path: |
            build/macOS/ExportOptions.plist
            build/macOS/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    name: GitHub Release
    needs: [prepare, mac]
    if: needs.prepare.outputs.is_tag == 'true' && needs.mac.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that can write: it holds no Apple secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.marketing_version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          files=(dist/*)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            flags=(--repo "$REPO" --title "Daybook $VERSION" --notes-file notes/release.md --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
          echo "### GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
