# Daybook for iPhone. Generate the Xcode project with `xcodegen` (or scripts/build-ios.sh).
# Daybook.xcodeproj is generated and ignored by git; this file is the source of truth.
name: Daybook

options:
  bundleIdPrefix: local.daybook
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    # The package and the Mac app use the Swift 5 language mode; the phone matches.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # XcodeGen's iOS target presets set "1,2", which overrides this; each target repeats it.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  # The repository's Swift package: DaybookKit (which re-exports DaybookCore and DaybookDevices),
  # DaybookLink, DaybookLive and DaybookModelStore for live captions, and DaybookIntelligence for
  # processing the iPhone's own recordings (docs/iphone.md, "Processing on this iPhone"), which
  # builds for iOS without WhisperKit and MLXVLM (Package.swift).
  Daybook:
    path: ../..

targets:
  DaybookPhone:
    type: application
    platform: iOS
    sources:
      - path: DaybookPhone
      - path: Shared
    dependencies:
      - package: Daybook
        product: DaybookCore
      - package: Daybook
        product: DaybookKit
      - package: Daybook
        product: DaybookLink
      - package: Daybook
        product: DaybookCaptions
      # Live transcription from local models (FluidAudio) and their store.
      - package: Daybook
        product: DaybookLive
      - package: Daybook
        product: DaybookModelStore
      # Transcription, speakers, voice profiles, and summaries of the iPhone's own recordings: the
      # Mac's engines (FluidAudio, MLX) and its ProcessingEngine.
      - package: Daybook
        product: DaybookIntelligence
      - target: DaybookPhoneWidgets
        embed: true
        codeSign: true
    entitlements:
      path: DaybookPhone/Resources/DaybookPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.daybook
        # Sync uses the app's own iCloud ubiquity container (hidden from the Files app: no
        # NSUbiquitousContainers entry), resolved by LibrarySyncController from
        # DaybookICloudContainerIdentifier below. DAYBOOK_ICLOUD_CONTAINER is set in Config/Signing.xcconfig.
        # CloudKit in the same container carries the courier (CloudKitCourier, docs/icloud-sync.md), whose
        # CKSyncEngine needs push: DAYBOOK_APS_ENVIRONMENT is `development` for development signing, and the
        # App Store export re-signs it `production`.
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - $(DAYBOOK_ICLOUD_CONTAINER)
        com.apple.developer.ubiquity-container-identifiers:
          - $(DAYBOOK_ICLOUD_CONTAINER)
        aps-environment: $(DAYBOOK_APS_ENVIRONMENT)
        # The app's own group first, the default for items stored without one (pairing keys, the sync device ID);
        # then local.daybook.phone's, where the iPhone app stored them before the one bundle ID (docs/iphone.md,
        # "Moving to the new app"), so they stay readable; then the group the Mac app also lists, for library and
        # cloud keys in iCloud Keychain (KeychainLibraryKeyStore, docs/icloud-sync.md, "Encryption"). Automatic
        # signing's profiles grant <team>.*.
        keychain-access-groups:
          - $(AppIdentifierPrefix)local.daybook
          - $(AppIdentifierPrefix)local.daybook.phone
          - $(AppIdentifierPrefix)local.daybook.shared
        # Joining a Soundcore Work's own network for Wi-Fi Fast Transfer (NEHotspotConfiguration;
        # docs/direct-soundcore.md, "Wi-Fi Fast Transfer"). Enabled on the App ID by the account owner.
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: DaybookPhone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        DaybookICloudContainerIdentifier: $(DAYBOOK_ICLOUD_CONTAINER)
        # The keychain group above, as signing expands it, for KeychainLibraryKeyStore.
        DaybookKeychainSharedGroup: $(AppIdentifierPrefix)local.daybook.shared
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Daybook records your conversations with the microphone.
        NSCameraUsageDescription: Daybook takes photos of whiteboards, slides, and notes for your conversations.
        # Asked only if on-device live captions turn out to need it (see DaybookCaptions' LiveCaptionAuthorization).
        NSSpeechRecognitionUsageDescription: Daybook shows live captions while it records.
        NSLocalNetworkUsageDescription: Daybook finds your Mac on this network to record together.
        NSBonjourServices:
          - _daybook-link._tcp
        NSBluetoothAlwaysUsageDescription: Daybook connects to your Soundcore Work to import its recordings.
        # audio: recording with the screen locked; bluetooth-central: Soundcore imports and state
        # restoration; fetch: BGAppRefreshTask sync passes (PhoneSync.refreshIdentifier);
        # remote-notification: CloudKit's silent pushes, which the courier's CKSyncEngine relies on;
        # processing: background tasks for processing, here the continued-processing task that lets
        # transcribing this iPhone's recordings go on in the background (ContinuedProcessing).
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - fetch
          - remote-notification
          - processing
        # The sync pass, and one continued-processing task per job (`local.daybook.phone.processing.<UUID>`).
        BGTaskSchedulerPermittedIdentifiers:
          - local.daybook.phone.sync
          - local.daybook.phone.processing.*
        NSSupportsLiveActivities: true
        # Audio shared to Daybook (Voice Memos, call recordings saved from Notes, Files) is copied in.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - public.aiff-audio
    settings:
      base:
        # One bundle ID for the iPhone and Mac apps: one App Store Connect record ships both (docs/release.md, "Bundle
        # IDs"). The app was local.daybook.phone before.
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook
        PRODUCT_NAME: DaybookPhone
        # iPhone only. On iPad, App Store validation requires all four orientations for multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Generated by scripts/make-ios-icon.swift (any, dark, tinted); TestFlight requires an icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  DaybookPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaybookPhoneWidgets
      - path: Shared
    entitlements:
      path: DaybookPhoneWidgets/DaybookPhoneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.daybook
    info:
      path: DaybookPhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook.widgets
        PRODUCT_NAME: DaybookPhoneWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DaybookPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaybookPhoneTests
        excludes:
          - "Fixtures/**"
      # Files shipped versions wrote, copied into the bundle as they are (DaybookPhoneTests/Fixtures).
      - path: DaybookPhoneTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      # Hosted in the app, which already links DaybookCore; linking it again would load two copies.
      - target: DaybookPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  DaybookPhone:
    build:
      targets:
        DaybookPhone: all
        DaybookPhoneWidgets: all
        DaybookPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DaybookPhoneTests
    archive:
      config: Release
