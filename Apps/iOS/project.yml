# Daybook for iPhone. Generate the Xcode project with `xcodegen` (or scripts/build-ios.sh).
# Daybook.xcodeproj is generated and ignored by git; this file is the source of truth.
name: Daybook

options:
  bundleIdPrefix: local.daybook
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    # The package and the Mac app use the Swift 5 language mode; the phone matches.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # XcodeGen's iOS target presets set "1,2", which overrides this; each target repeats it.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  # The repository's Swift package: DaybookKit (which re-exports DaybookCore and DaybookDevices)
  # and DaybookLink. DaybookIntelligence stays out until on-device processing is wanted.
  Daybook:
    path: ../..

targets:
  DaybookPhone:
    type: application
    platform: iOS
    sources:
      - path: DaybookPhone
      - path: Shared
    dependencies:
      - package: Daybook
        product: DaybookCore
      - package: Daybook
        product: DaybookKit
      - package: Daybook
        product: DaybookLink
      - package: Daybook
        product: DaybookCaptions
      - target: DaybookPhoneWidgets
        embed: true
        codeSign: true
    entitlements:
      path: DaybookPhone/Resources/DaybookPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.daybook.phone
        # Sync uses the app's own iCloud ubiquity container (hidden from the Files app: no
        # NSUbiquitousContainers entry), resolved by LibrarySyncController from
        # DaybookICloudContainerIdentifier below. DAYBOOK_ICLOUD_CONTAINER is set in Config/Signing.xcconfig.
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - $(DAYBOOK_ICLOUD_CONTAINER)
        com.apple.developer.ubiquity-container-identifiers:
          - $(DAYBOOK_ICLOUD_CONTAINER)
    info:
      path: DaybookPhone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        DaybookICloudContainerIdentifier: $(DAYBOOK_ICLOUD_CONTAINER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Daybook records your conversations with the microphone.
        # Asked only if on-device live captions turn out to need it (see DaybookCaptions' LiveCaptionAuthorization).
        NSSpeechRecognitionUsageDescription: Daybook shows live captions while it records.
        NSLocalNetworkUsageDescription: Daybook finds your Mac on this network to record together.
        NSBonjourServices:
          - _daybook-link._tcp
        NSBluetoothAlwaysUsageDescription: Daybook connects to your Soundcore Work to import its recordings.
        # audio: recording with the screen locked; bluetooth-central: Soundcore imports and state
        # restoration; fetch: BGAppRefreshTask sync passes (PhoneSync.refreshIdentifier).
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - local.daybook.phone.sync
        NSSupportsLiveActivities: true
        # Audio shared to Daybook (Voice Memos, call recordings saved from Notes, Files) is copied in.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - public.aiff-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook.phone
        PRODUCT_NAME: DaybookPhone
        # iPhone only. On iPad, App Store validation requires all four orientations for multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Generated by scripts/make-ios-icon.swift (any, dark, tinted); TestFlight requires an icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  DaybookPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaybookPhoneWidgets
      - path: Shared
    entitlements:
      path: DaybookPhoneWidgets/DaybookPhoneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.daybook.phone
    info:
      path: DaybookPhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook.phone.widgets
        PRODUCT_NAME: DaybookPhoneWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DaybookPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaybookPhoneTests
    dependencies:
      # Hosted in the app, which already links DaybookCore; linking it again would load two copies.
      - target: DaybookPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.daybook.phone.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  DaybookPhone:
    build:
      targets:
        DaybookPhone: all
        DaybookPhoneWidgets: all
        DaybookPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DaybookPhoneTests
    archive:
      config: Release
